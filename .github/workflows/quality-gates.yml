name: Quality Gates

on:
  push:
    branches: [ main, dev/* ]
  pull_request:
    branches: [ main, dev/* ]

concurrency:
  group: quality-gates-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dev dependencies
        run: uv sync --all-packages --all-extras

      # Ignored vulnerabilities must each carry a reason and a removal condition.
      # Prefer upgrading; only ignore when no fixed release exists upstream.
      #
      # CVE-2026-69112 / GHSA-4j2p-28q2-5m79 (same advisory, both IDs passed so the
      #   ignore keeps matching whichever one OSV reports as primary) - accelerate
      #   path traversal / DoS via sharded checkpoint weight_map entries. Affects
      #   `<= 1.14.0`; 1.14.0 is the newest release on PyPI, so every version in
      #   range is vulnerable and there is nothing to upgrade to. accelerate is
      #   transitive via docling-slim[standard], which requires accelerate<2,>=1.0.0,
      #   so it cannot be constrained away without dropping the extra. Reached only
      #   when loading a sharded checkpoint from an untrusted source; HarborRAG loads
      #   models from pinned Hugging Face releases.
      #   REMOVE when accelerate ships a fixed release and uv.lock picks it up.
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --all-packages --all-extras --no-dev \
            --no-emit-workspace --no-hashes --quiet \
            --output-file /tmp/harborrag-audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/harborrag-audit-requirements.txt \
            --disable-pip --no-deps \
            --ignore-vuln CVE-2026-69112 \
            --ignore-vuln GHSA-4j2p-28q2-5m79

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config .pre-commit-config.yaml

      - name: Documentation publication boundary
        run: |
          uv run python website/check_publication.py
          uv run python website/check_docs_publish_path.py

      - name: Lint
        run: uv run make lint

      - name: Complexity ratchet
        run: uv run make complexity

      - name: File length
        run: uv run make file-length

      - name: Import boundaries
        run: uv run make import-boundaries

      - name: Type check
        run: uv run make typecheck

      - name: Dependency direction check
        run: uv run make deps-check

      - name: Compile check
        run: uv run make compile

      - name: Coverage gate
        run: uv run make coverage
