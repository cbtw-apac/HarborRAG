# Matches the pre-commit>=3.5.0 floor in pyproject.toml. 3.5.0 is the release
# that added per-hook fail_fast, the newest feature this config uses; the
# pre-push stage name landed in 3.2.0 and default_install_hook_types in 2.18.0.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # LICENSE must stay byte-exact; website/assets is a vendored icon/JS/CSS
      # library that no HarborRAG source change should reformat.
      - id: trailing-whitespace
        exclude: ^(LICENSE|website/assets/)
      - id: end-of-file-fixer
        exclude: ^(LICENSE|website/assets/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # The excluded file asserts that redact_mapping() masks a private-key
      # marker; it holds the literal header string and no key material.
      - id: detect-private-key
        exclude: ^packages/harborrag-core/tests/test_core_contracts_domain_security\.py$

  - repo: local
    hooks:
      # ---------- pre-commit stage: seconds ------------------------
      - id: ruff-format
        name: ruff format
        entry: uv run --all-packages --all-extras ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --all-packages --all-extras ruff check --fix --ignore C901,PLR0913
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: file-length
        name: python file length (<=349)
        entry: uv run --all-packages --all-extras python scripts/check_python_file_length.py
        language: system
        types: [python]
        pass_filenames: false

      - id: complexity-ratchet
        name: complexity ratchet
        entry: uv run --all-packages --all-extras python scripts/check_ruff_complexity.py
        language: system
        types: [python]
        pass_filenames: false

      # --------- pre-push stage: cheapest first ----------------
      - id: import-boundaries
        name: import-linter contracts
        entry: uv run --all-packages --all-extras lint-imports
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        fail_fast: true

      - id: deps-check
        name: dependency direction
        entry: uv run --all-packages --all-extras python scripts/check_dependency_direction.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        fail_fast: true

      - id: compile
        name: compileall
        entry: uv run --all-packages --all-extras python -m compileall -q packages scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        fail_fast: true

      - id: typecheck
        name: mypy
        entry: uv run --all-packages --all-extras mypy packages
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        fail_fast: true

      # The 90% coverage gate stays in CI only.
