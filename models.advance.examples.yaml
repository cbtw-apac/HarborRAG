# Advanced HarborRAG model configuration.

chat:
  default_model: chat-primary
  timeouts:
    request_seconds: 60
    stream_seconds: 120

  retry:
    # Attempts against the same concrete deployment, including the first call.
    same_deployment_attempts: 3
    # Number of other deployments allowed within the same logical model.
    max_deployment_failovers: 1
    # Number of logical-model transitions allowed through `fallbacks`.
    max_model_fallbacks: 1
    base_delay_seconds: 0.25
    max_delay_seconds: 8
    jitter_ratio: 0.2

  routing:
    # `harbor` invokes the selected provider directly. `litellm_router` uses a
    # private Router group for that selected chat/embed deployment. Harbor retains
    # retry and fallback decisions so normalized counters remain exact.
    engine: harbor
    # Harbor supports ordered, weighted, round_robin, least_busy, and latency.
    # LiteLLM Router supports ordered/weighted, least_busy, and latency here.
    strategy: weighted
    enable_health_tracking: true
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      recovery_timeout_seconds: 30

  cache:
    # Caching is opt-in globally and per request. A request with cacheable=false
    # always bypasses cache, even when a profile enables this block.
    enabled: false
    # `custom` uses an injected ModelResponseCache or the bounded in-memory cache.
    # `litellm` delegates cache
    # storage to LiteLLM, whose Redis/hosted cache must be configured at startup.
    backend: custom
    ttl_seconds: 300
    key_namespace: harborrag:chat
    max_entries: 4096
    cache_sensitive_requests: false
    # Tenant-scoped keys are required by the safe default.
    require_tenant_id: true

  observability:
    enabled: true
    # `ignore` isolates exporter failures; `raise` makes them request failures.
    failure_mode: ignore
    include_stream_events: true
    # This block applies before events reach StructuredLoggingTelemetry,
    # LangfuseTelemetry, OpenTelemetryTelemetry, or LiteLLMTelemetryCallback.
    # Sink and callback instances are supplied by the application.
    privacy:
      log_inputs: false
      log_outputs: false
      hash_user_identifiers: true
      redact_fields:
        - api_key
        - authorization
        - password
        - secret
        - token
        - retrieval_query
      metadata_allowlist:
        - request_id
        - trace_id
        - conversation_id
        - tenant_id
        - user_id
        - workflow_id
        - collection_name
        - pipeline_stage
        - prompt_template_version
      max_logged_content_length: 2000

  # Native JSON Schema is preferred, JSON mode is the configured degradation,
  # and one repair completion is allowed after a validation failure.
  structured_output:
    degradation: json_mode
    max_repair_attempts: 1

  security:
    allowed_providers: [openai, anthropic]
    # Provider default endpoints do not need api_base. Any configured api_base
    # must use a host in this list.
    allowed_base_url_hosts: [api.openai.com, api.anthropic.com, localhost]
    require_https_for_remote_endpoints: true
    allow_custom_providers: false
    allow_request_auth_headers: false
    max_extra_params: 32
    # extra_litellm_params and per-request extra_params are denied unless listed.
    allowed_extra_litellm_params:
      - organization
      - project
      - service_tier
      - reasoning_effort
      - verbosity
      - safety_identifier
      - drop_params
      - additional_drop_params
      - enable_json_schema_validation
      - model_id
      - role_name

  models:
    chat-primary:
      aliases: [assistant, generation]
      fallbacks: [chat-backup]
      default_params:
        temperature: 0.2
        top_p: 0.95
        max_completion_tokens: 2048
        stop: ["<END>"]
        seed: 42
      deployments:
        - name: openai-east
          provider: openai
          model: openai/gpt-4.1-mini
          api_key: ${OPENAI_API_KEY}
          weight: 3
          order: 0
          rpm: 1000
          tpm: 1000000
          max_parallel_requests: 100
          enabled: true
          # Capability flags gate client.stream/astream, tool definitions,
          # structured/JSON responses, and multimodal message parts.
          capabilities:
            streaming: true
            tools: true
            parallel_tools: true
            structured_output: true
            json_mode: true
            multimodal: true
          headers:
            X-Harbor-Region: east
          extra_litellm_params:
            service_tier: auto
        - name: openai-west
          provider: openai
          model: openai/gpt-4.1-mini
          api_key: ${OPENAI_API_KEY_SECONDARY}
          weight: 1
          # Equal order places both deployments in the weighted routing group.
          order: 0
          rpm: 500
          tpm: 500000
          max_parallel_requests: 50
          capabilities:
            streaming: true
            tools: true
            parallel_tools: true
            structured_output: true
            json_mode: true
            multimodal: true
    chat-backup:
      deployments:
        - name: anthropic-primary
          provider: anthropic
          model: anthropic/claude-sonnet-4-5
          api_key: ${ANTHROPIC_API_KEY}
          order: 0
          capabilities:
            streaming: true
            tools: true
            parallel_tools: true
            multimodal: true

embed:
  default_model: embed-primary
  timeouts:
    request_seconds: 60
  default_batch_size: 128
  max_inputs_per_request: 2048
  max_characters_per_input: 200000

  retry:
    same_deployment_attempts: 3
    max_deployment_failovers: 1
    max_model_fallbacks: 1
    base_delay_seconds: 0.25
    max_delay_seconds: 8
    jitter_ratio: 0.2
  routing:
    engine: harbor
    strategy: least_busy
    enable_health_tracking: true
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      recovery_timeout_seconds: 30
  cache:
    # Embedding cache is also disabled until a profile and request opt in.
    enabled: false
    backend: custom
    ttl_seconds: 3600
    key_namespace: harborrag:embed
    max_entries: 10000
    cache_sensitive_requests: false
    require_tenant_id: true
  observability:
    enabled: true
    failure_mode: ignore
    include_stream_events: false
    privacy:
      log_inputs: false
      # Embedding vectors can be large and sensitive; keep this false normally.
      log_outputs: false
      hash_user_identifiers: true
      redact_fields: [api_key, authorization, token]
      metadata_allowlist:
        - request_id
        - trace_id
        - tenant_id
        - user_id
        - workflow_id
        - collection_name
        - pipeline_stage
        - embedding_purpose
      max_logged_content_length: 1000
  security:
    allowed_providers: [openai]
    allowed_base_url_hosts: [api.openai.com, localhost]
    require_https_for_remote_endpoints: true
    allow_custom_providers: false
    allow_request_auth_headers: false
    max_extra_params: 16
    allowed_extra_litellm_params:
      - input_type
      - truncate
      - task_type
      - output_dimension
      - output_dtype
      - encoding_format
      - drop_params
      - additional_drop_params
      - model_id
      - role_name

  models:
    embed-primary:
      aliases: [retrieval-embedding]
      fallbacks: [embed-backup]
      # Every fallback used by one index must declare the same embedding space.
      embedding_space: retrieval-v1
      default_params:
        dimensions: 1536
        encoding_format: float
        normalize: true
        batch_size: 128
      deployments:
        - name: openai-embedding-primary
          provider: openai
          model: openai/text-embedding-3-small
          api_key: ${OPENAI_API_KEY}
          expected_dimensions: 1536
          max_batch_size: 128
          weight: 3
          rpm: 3000
          tpm: 1000000
          max_parallel_requests: 100
          capabilities:
            batch: true
            configurable_dimensions: true
            encoding_format: true
            max_batch_size: 128
            default_dimensions: 1536
    embed-backup:
      embedding_space: retrieval-v1
      default_params:
        dimensions: 1536
        normalize: true
      deployments:
        - name: openai-embedding-secondary
          provider: openai
          model: openai/text-embedding-3-small
          api_key: ${OPENAI_API_KEY_SECONDARY}
          expected_dimensions: 1536
          max_batch_size: 128
          capabilities:
            batch: true
            configurable_dimensions: true
            encoding_format: true
            max_batch_size: 128
            default_dimensions: 1536

rerank:
  default_model: rerank-primary
  timeouts:
    request_seconds: 45
  max_documents_per_request: 1000
  max_query_characters: 100000
  max_document_characters: 500000

  retry:
    same_deployment_attempts: 2
    max_deployment_failovers: 1
    max_model_fallbacks: 1
    base_delay_seconds: 0.25
    max_delay_seconds: 8
    jitter_ratio: 0.2
  routing:
    engine: harbor
    strategy: ordered
    enable_health_tracking: true
    circuit_breaker:
      enabled: true
      failure_threshold: 4
      recovery_timeout_seconds: 20
  cache:
    enabled: false
    backend: custom
    ttl_seconds: 600
    key_namespace: harborrag:rerank
    max_entries: 4096
    cache_sensitive_requests: false
    require_tenant_id: true
  observability:
    enabled: true
    failure_mode: ignore
    include_stream_events: false
    privacy:
      log_inputs: false
      log_outputs: false
      hash_user_identifiers: true
      redact_fields: [api_key, authorization, token]
      metadata_allowlist:
        - request_id
        - trace_id
        - tenant_id
        - user_id
        - workflow_id
        - collection_name
        - pipeline_stage
      max_logged_content_length: 1000
  security:
    allowed_providers: [cohere]
    allowed_base_url_hosts: [api.cohere.com, localhost]
    require_https_for_remote_endpoints: true
    allow_custom_providers: false
    allow_request_auth_headers: false
    max_extra_params: 16
    allowed_extra_litellm_params:
      - truncate
      - priority
      - drop_params
      - additional_drop_params
      - model_id
      - role_name

  models:
    rerank-primary:
      aliases: [retrieval-reranker]
      fallbacks: [rerank-backup]
      default_params:
        top_n: 20
        return_documents: true
        max_chunks_per_doc: 4
        max_tokens_per_doc: 4096
        instruction: Rank documents by relevance to the retrieval query.
      deployments:
        - name: cohere-rerank-primary
          provider: cohere
          model: cohere/rerank-v3.5
          api_key: ${COHERE_API_KEY}
          max_documents: 1000
          order: 0
          rpm: 1000
          max_parallel_requests: 50
          capabilities:
            structured_documents: true
            rank_fields: true
            return_documents: true
            max_chunks_per_doc: true
            max_tokens_per_doc: true
            instruction: true
            cost_tracking: true
            max_documents: 1000
          extra_litellm_params:
            priority: standard
    rerank-backup:
      deployments:
        - name: cohere-rerank-secondary
          provider: cohere
          model: cohere/rerank-v3.5
          api_key: ${COHERE_API_KEY_SECONDARY}
          max_documents: 1000
          capabilities:
            structured_documents: true
            rank_fields: true
            return_documents: true
            max_chunks_per_doc: true
            max_tokens_per_doc: true
            instruction: true
            cost_tracking: true
            max_documents: 1000

# Profiles are deep-merged partial overrides. Omitted families and fields retain
# their base values, and unmentioned base models remain configured.
profiles:
  production:
    # This profile delegates in-model routing and response caching to LiteLLM.
    # Configure LiteLLM's Redis or hosted cache separately during application
    # startup; Harbor's schema owns policy, TTL, and tenant-isolated keys only.
    chat:
      routing:
        engine: litellm_router
        strategy: weighted
      cache:
        enabled: true
        backend: litellm
        ttl_seconds: 300
      provider_budgets:
        openai:
          max_budget: 250
          budget_duration: 30d
          rpm_limit: 1000
          tpm_limit: 1000000
    embed:
      routing:
        engine: litellm_router
        strategy: least_busy
      cache:
        enabled: true
        backend: litellm
        ttl_seconds: 3600
      provider_budgets:
        openai:
          max_budget: 100
          budget_duration: 30d
          rpm_limit: 3000
          tpm_limit: 1000000
    rerank:
      routing:
        # LiteLLM Router has no reliable synchronous rerank path; Harbor owns
        # rerank deployment selection while LiteLLM still handles invocation.
        engine: harbor
        strategy: ordered
      cache:
        enabled: true
        backend: litellm
        ttl_seconds: 600

  harbor-round-robin:
    # Round robin is a Harbor selector strategy. LiteLLM Router does not expose
    # the same strategy through this adapter, so keep engine=harbor here.
    chat:
      routing:
        engine: harbor
        strategy: round_robin

  cloud-providers:
    # Provider showcase models are intentionally separate logical routing groups.
    # Only combine deployments under one logical model when their capabilities and
    # response semantics are interchangeable for your application.
    chat:
      security:
        allowed_providers:
          - openai
          - anthropic
          - azure_openai
          - bedrock
          - gemini
          - openai_compatible
        allowed_base_url_hosts:
          - api.openai.com
          - api.anthropic.com
          - azure.example.com
          - gateway.example.com
          - localhost
      models:
        chat-azure:
          aliases: [azure-assistant]
          deployments:
            - name: azure-openai-chat
              provider: azure_openai
              model: "azure/${AZURE_OPENAI_CHAT_DEPLOYMENT}"
              api_key: ${AZURE_OPENAI_API_KEY}
              api_base: ${AZURE_OPENAI_API_BASE}
              api_version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
              deployment_name: ${AZURE_OPENAI_CHAT_DEPLOYMENT}
              max_parallel_requests: 80
              headers:
                X-Harbor-Cloud: azure
              capabilities:
                streaming: true
                tools: true
                parallel_tools: true
                structured_output: true
                json_mode: true
                multimodal: true
        chat-bedrock:
          aliases: [aws-assistant]
          deployments:
            - name: bedrock-anthropic-chat
              provider: bedrock
              model: "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"
              aws_region_name: ${AWS_REGION:-us-east-1}
              allow_ambient_credentials: true
              max_parallel_requests: 40
              capabilities:
                streaming: true
                tools: true
                parallel_tools: true
                multimodal: true
        chat-gemini:
          aliases: [gemini-assistant]
          deployments:
            - name: gemini-chat
              provider: gemini
              model: gemini/gemini-2.5-flash
              api_key: ${GEMINI_API_KEY}
              max_parallel_requests: 80
              capabilities:
                streaming: true
                tools: true
                structured_output: true
                json_mode: true
                multimodal: true
        chat-compatible:
          aliases: [gateway-assistant]
          deployments:
            - name: openai-compatible-chat
              provider: openai_compatible
              model: openai/harbor-chat
              api_key: ${OPENAI_COMPATIBLE_API_KEY}
              api_base: ${OPENAI_COMPATIBLE_API_BASE}
              max_parallel_requests: 50
              headers:
                X-Harbor-Tenant: ${HARBOR_GATEWAY_TENANT:-example-tenant}
              # Capabilities for compatible servers must be declared from the
              # server's contract instead of inferred from the OpenAI protocol.
              capabilities:
                streaming: true
                tools: true
                json_mode: true

    embed:
      security:
        allowed_providers:
          - openai
          - azure_openai
          - bedrock
          - gemini
          - openai_compatible
        allowed_base_url_hosts:
          - api.openai.com
          - azure.example.com
          - gateway.example.com
          - localhost
      models:
        embed-azure:
          aliases: [azure-embedding]
          embedding_space: azure-retrieval-v1
          default_params:
            dimensions: 1536
            normalize: true
          deployments:
            - name: azure-openai-embedding
              provider: azure_openai
              model: "azure/${AZURE_OPENAI_EMBED_DEPLOYMENT}"
              api_key: ${AZURE_OPENAI_API_KEY}
              api_base: ${AZURE_OPENAI_API_BASE}
              api_version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
              deployment_name: ${AZURE_OPENAI_EMBED_DEPLOYMENT}
              expected_dimensions: 1536
              max_batch_size: 128
              capabilities:
                batch: true
                configurable_dimensions: true
                encoding_format: true
                max_batch_size: 128
                default_dimensions: 1536
        embed-bedrock:
          aliases: [aws-embedding]
          embedding_space: bedrock-retrieval-v1
          default_params:
            dimensions: 1024
            normalize: true
          deployments:
            - name: bedrock-titan-embedding
              provider: bedrock
              model: bedrock/amazon.titan-embed-text-v2:0
              aws_region_name: ${AWS_REGION:-us-east-1}
              allow_ambient_credentials: true
              expected_dimensions: 1024
              max_batch_size: 32
              capabilities:
                batch: true
                max_batch_size: 32
                default_dimensions: 1024
        embed-gemini:
          aliases: [gemini-embedding]
          embedding_space: gemini-retrieval-v1
          default_params:
            purpose: document
            normalize: true
          deployments:
            - name: gemini-embedding
              provider: gemini
              model: gemini/text-embedding-004
              api_key: ${GEMINI_API_KEY}
              expected_dimensions: 768
              max_batch_size: 100
              capabilities:
                batch: true
                purpose: true
                supported_purposes: [query, document, classification, clustering]
                max_batch_size: 100
                default_dimensions: 768
        embed-compatible:
          aliases: [gateway-embedding]
          embedding_space: gateway-retrieval-v1
          default_params:
            normalize: true
          deployments:
            - name: openai-compatible-embedding
              provider: openai_compatible
              model: openai/harbor-embedding
              api_key: ${OPENAI_COMPATIBLE_API_KEY}
              api_base: ${OPENAI_COMPATIBLE_API_BASE}
              expected_dimensions: 1536
              max_batch_size: 64
              headers:
                X-Harbor-Tenant: ${HARBOR_GATEWAY_TENANT:-example-tenant}
              capabilities:
                batch: true
                max_batch_size: 64
                default_dimensions: 1536

    rerank:
      security:
        allowed_providers: [cohere, bedrock]
        allowed_base_url_hosts: [api.cohere.com, localhost]
      models:
        rerank-bedrock:
          aliases: [aws-reranker]
          deployments:
            - name: bedrock-rerank
              provider: bedrock
              model: bedrock/amazon.rerank-v1:0
              aws_region_name: ${AWS_REGION:-us-east-1}
              allow_ambient_credentials: true
              max_documents: 100
              capabilities:
                return_documents: true
                cost_tracking: true
                max_documents: 100

  local:
    # Local models are added to the base model map and selected as defaults.
    chat:
      default_model: local-chat
      security:
        allowed_providers: [openai, anthropic, ollama]
      models:
        local-chat:
          deployments:
            - name: ollama-chat
              provider: ollama
              model: ollama/llama3.2
              api_base: http://localhost:11434
              capabilities:
                streaming: true
    embed:
      default_model: local-embed
      security:
        allowed_providers: [openai, ollama]
      models:
        local-embed:
          embedding_space: local-retrieval-v1
          default_params:
            normalize: true
          deployments:
            - name: ollama-embedding
              provider: ollama
              model: ollama/nomic-embed-text
              api_base: http://localhost:11434
              expected_dimensions: 768
              max_batch_size: 32
              capabilities:
                batch: true
                max_batch_size: 32
                default_dimensions: 768
    rerank:
      default_model: local-rerank
      security:
        allowed_providers: [cohere, infinity]
      models:
        local-rerank:
          deployments:
            - name: infinity-rerank
              provider: infinity
              model: infinity/cross-encoder/ms-marco-MiniLM-L-6-v2
              api_base: http://localhost:7997
              max_documents: 100
              capabilities:
                structured_documents: true
                return_documents: true
                max_documents: 100
