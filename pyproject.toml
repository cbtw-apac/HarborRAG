[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "harborrag-workspace"
version = "2.0.0"
description = "A modular, provider-agnostic RAG framework for engineering knowledge with connectors, parsers, repositories, runtime, API, and MCP support"
readme = "README.md"
authors = [
    { name = "HarborRAG Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Environment :: Console",
    "Typing :: Typed",
]
requires-python = ">=3.12"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/cbtw-apac/HarborRAG"
Repository = "https://github.com/cbtw-apac/HarborRAG"
Issues = "https://github.com/cbtw-apac/HarborRAG/issues"
Documentation = "https://github.com/cbtw-apac/HarborRAG/tree/main/docs"

[project.optional-dependencies]
dev = [
    "click>=8.1,<9",
    "packaging>=24,<27",
    "python-dotenv>=1,<2",
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "litellm>=1.90.0,<1.92.0",
    "opentelemetry-api>=1.43,<2",
    "opentelemetry-sdk>=1.43,<2",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "cairosvg>=2.7.0",
    "import-linter>=2.13,<3",
    "mypy>=1.0.0",
    "types-jsonschema>=4.26,<5",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "requests>=2.28.0",
    "responses>=0.24.1",
    "requests-mock>=1.11.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "docx2txt>=0.9",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pyarrow==25.0.0",
    "PyMuPDF>=1.24.0",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "httpx2>=2.7,<3",
]
docs = [
    "tomli>=2.0.0",
    "markdown>=3.5.0",
    "pygments>=2.15.0",
    "pymdown-extensions>=10.0.0",
]

# The workspace root is a metadata-only project. Each package under packages/*
# owns its own build configuration and importable src/ package.
[tool.setuptools]
py-modules = []

[tool.mypy]
python_version = "3.12"
# Type-check against POSIX regardless of the contributor's OS. Without this,
# mypy resolves os/signal stubs for the host platform, so Windows contributors
# get attr-defined errors on os.fchmod, os.killpg, and signal.SIGKILL that
# Linux CI never reports. Pinning keeps the local pre-push gate and the CI
# quality workflow in agreement. Deployment targets are Linux containers.
platform = "linux"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
mypy_path = "packages/harborrag-core/src:packages/harborrag-adapters/src:packages/harborrag-engine/src:packages/harborrag-memory/src:packages/harborrag-runtime/src:packages/harborrag-app/src:packages/harborrag-mcp-server/src:packages/harborrag/src"

# Package-local tests deliberately exercise abstract base classes (safe-super)
# and index into loosely-typed diagnostics payloads; keep strictness for src only.
exclude = "packages/[^/]+/tests/"

# Optional, lazily-imported provider integrations (secrets backends, OCR/PDF
# engines) with no usable stubs. Each import site already fails closed with a
# friendly error when the library isn't installed; ignore_missing_imports just
# keeps that intentional optionality from failing the type check.
[[tool.mypy.overrides]]
module = [
    "fitz",
    "paddleocr",
    "pytesseract",
    "rapidocr",
    "docx2txt",
    "odf",
    "odf.*",
    "boto3",
    "google.cloud",
    "google.cloud.*",
    "langchain_text_splitters",
    "azure.identity",
    "azure.keyvault.secrets",
    "falkordb.asyncio",
    "cloudpickle",
    "docling.*",
    "fastmcp",
    "langfuse",
    "liteparse",
    "pptx",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
    "tests",
    "packages/harborrag-core/tests",
    "packages/harborrag-adapters/tests",
    "packages/harborrag-engine/tests",
    "packages/harborrag-memory/tests",
    "packages/harborrag-runtime/tests",
    "packages/harborrag-app/tests",
    "packages/harborrag-mcp-server/tests",
    "packages/harborrag/tests",
]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "venv",
    "env",
    "node_modules",
    "htmlcov",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "-m",
    "not integration and not e2e and not smoke",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "unit: fast, isolated, no I/O",
    "contract: port/protocol conformance suite",
    "integration: real adapter against a real backend",
    "smoke: minimal post-deploy liveness check",
    "e2e: full-stack scenario test",
    "blackbox: public API behavior tests",
    "graybox: public behavior tests that assert observable internal signals",
    "whitebox: internal architecture and contract tests",
    "requires_deps: marks tests requiring optional dependencies",
    "workflow: marks tests that validate GitHub Actions workflow",
    "chaos: deterministic fault-injection and recovery tests",
    "performance: bounded local performance and concurrency tests",
    "load: correctness-oriented local micro-load tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # aiosqlite's background connection thread occasionally reports its result
    # back via call_soon_threadsafe just as a short-lived pytest-asyncio loop
    # is closing; the query already succeeded, only the after-the-fact
    # callback races the loop teardown. Harmless and specific to aiosqlite's
    # worker thread, not a blanket suppression of unrelated thread crashes.
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
branch = true
source = [
    "packages/harborrag-core/src",
    "packages/harborrag-adapters/src",
    "packages/harborrag-engine/src",
    "packages/harborrag-memory/src",
    "packages/harborrag-runtime/src",
    "packages/harborrag-app/src",
    "packages/harborrag-mcp-server/src",
    "packages/harborrag/src",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/site/*",
    "*/htmlcov*/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages",
    "tests",
    "scripts",
]
extend-exclude = [
    "venv",
    "venv-*",
    "**/venv/**",
    "**/.venv/**",
    "env",
    "env-*",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C90",
    "C4",
    "PLR0913",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B017",
    "B904",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = [
    "harborrag",
    "harborrag_core",
    "harborrag_adapters",
    "harborrag_engine",
    "harborrag_memory",
    "harborrag_runtime",
    "harborrag_app",
    "harborrag_mcp_server",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "B017"]
"packages/*/tests/*" = ["B011", "B017"]
"tests/*.py" = ["D101", "D103"]
"tests/**/*.py" = ["D101", "D103"]

[tool.uv]
package = false
environments = [
    "python_version == '3.12'",
]

[tool.uv.workspace]
members = [
    "packages/harborrag-core",
    "packages/harborrag-adapters",
    "packages/harborrag-engine",
    "packages/harborrag-memory",
    "packages/harborrag-runtime",
    "packages/harborrag-app",
    "packages/harborrag-mcp-server",
    "packages/harborrag",
]

[tool.uv.sources.harborrag-core]
workspace = true

[tool.uv.sources.harborrag-adapters]
workspace = true

[tool.uv.sources.harborrag-engine]
workspace = true

[tool.uv.sources.harborrag-memory]
workspace = true

[tool.uv.sources.harborrag-runtime]
workspace = true

[tool.uv.sources.harborrag-app]
workspace = true

[tool.uv.sources.harborrag-mcp-server]
workspace = true

[tool.uv.sources.harborrag]
workspace = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
