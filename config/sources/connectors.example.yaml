version: 1

connectors:
  harborrag-workspace:
    provider: local
    enabled: true
    environment:
      source_path: LOCAL_SOURCE_PATH
    settings:
      allowed_extensions: [md, markdown, txt, pdf, docx, doc, epub, odt, pptx, csv, xlsx, png, jpg, jpeg, html]
      excluded_extensions: []
      include_paths: []
      exclude_paths: []
      include_globs: []
      exclude_globs: []
      include_hidden: false
      follow_symlinks: false
      max_depth: null
      max_file_size_bytes: 20971520
      checksum_mode: stat
      fail_on_error: false
