version: 1

parsers:
  # Credential-free default for ordinary PDFs with embedded text. The fast
  # profile tries PyMuPDF first and LiteParse second.
  pdf-default:
    parser: pdf
    enabled: true
    settings:
      profile: fast
      min_content_chars: 20

  # Enable one alternative only: comment out pdf-default, then remove the
  # leading "# " from the complete block you want to use.

  # Balanced fallback chain for mixed text, layout, and occasional scans.
  # pdf-balanced:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     profile: balanced
  #     min_content_chars: 20

  # OCR-oriented fallback chain for predominantly scanned PDFs.
  # pdf-ocr:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     profile: ocr
  #     min_content_chars: 20

  # Highest-quality built-in chain; expect model downloads and more compute.
  # pdf-quality:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     profile: quality
  #     min_content_chars: 50

  # Fast embedded-text extraction with no backend-specific settings.
  # pdf-pymupdf-only:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 10
  #   engines:
  #     - backend: pymupdf

  # Layout-aware parsing with OCR and table reconstruction. Full-page OCR is
  # deliberately off; enable it only when most pages are scans.
  # pdf-docling:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 20
  #   engines:
  #     - backend: docling
  #       settings:
  #         do_ocr: true
  #         ocr_engine: rapidocr
  #         ocr_lang: [en]
  #         force_full_page_ocr: false
  #         bitmap_area_threshold: 0.05
  #         do_table_structure: true
  #         table_do_cell_matching: true
  #         accelerator_device: auto
  #         accelerator_threads: 4
  #         pdf_backend: pypdfium2
  #         max_num_pages: 500
  #         max_file_size: 104857600
  #         page_range: [1, 500]
  #         raises_on_error: true
  #         export_format: markdown
  #         strict_text: false
  #         include_raw_document: false
  #         extra_convert_options: {}

  # Local LiteParse with an optional external OCR service. Configure the
  # endpoint to implement LiteParse's HTTP OCR protocol.
  # pdf-liteparse-ocr-endpoint:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 20
  #   engines:
  #     - backend: liteparse
  #       settings:
  #         output_format: markdown
  #         image_mode: placeholder
  #         extract_links: true
  #         ocr_enabled: true
  #         ocr_language: eng
  #         ocr_server_url: http://127.0.0.1:8080
  #         tessdata_path: null
  #         max_pages: 1000
  #         target_pages: null
  #         dpi: 200
  #         preserve_very_small_text: false
  #         quiet: true
  #         num_workers: 4
  #         input_mode: path
  #         include_raw: false
  #         extra_options: {}
  #       secrets:
  #         password_env: PDF_DOCUMENT_PASSWORD

  # Local MinerU pipeline. The mineru executable must be installed and on PATH.
  # pdf-mineru-local:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 20
  #   engines:
  #     - backend: mineru
  #       settings:
  #         backend: pipeline
  #         executable: mineru
  #         timeout_seconds: 600
  #         method: auto
  #         language: null
  #         effort: medium
  #         api_url: null
  #         server_url: null
  #         output_dir: null
  #         keep_output: false
  #         extra_args: []
  #         working_directory: null

  # MinerU client for an authenticated OpenAI-compatible endpoint serving a
  # MinerU-compatible document VLM. This is not a generic OpenAI PDF backend.
  # pdf-mineru-vlm-endpoint:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 20
  #   engines:
  #     - backend: mineru
  #       settings:
  #         backend: vlm-http-client
  #         executable: mineru
  #         timeout_seconds: 900
  #         method: auto
  #         language: null
  #         effort: high
  #         server_url: https://your-vlm-endpoint.example/v1
  #         keep_output: false
  #         extra_args: []
  #       environment:
  #         MINERU_VL_API_KEY: OPENAI_API_KEY
  #         MINERU_VL_MODEL_NAME: OPENAI_VLM_MODEL
  #         MINERU_API_MAX_CONCURRENT_REQUESTS: MINERU_API_MAX_CONCURRENT_REQUESTS

  # OCR-heavy local document analysis. Start with CPU-safe settings; switch the
  # device and acceleration flags only after the Paddle runtime is installed.
  # pdf-paddleocr:
  #   parser: pdf
  #   enabled: true
  #   settings:
  #     min_content_chars: 20
  #   engines:
  #     - backend: paddleocr
  #       settings:
  #         pipeline_class: PPStructureV3
  #         fallback_pipeline_classes: [PaddleOCRVL, PPStructure]
  #         lang: en
  #         device: cpu
  #         engine: null
  #         enable_hpi: false
  #         use_tensorrt: false
  #         precision: fp32
  #         enable_mkldnn: true
  #         cpu_threads: 4
  #         use_doc_orientation_classify: true
  #         use_doc_unwarping: true
  #         use_textline_orientation: true
  #         use_table_recognition: true
  #         use_formula_recognition: false
  #         use_chart_recognition: false
  #         use_region_detection: true
  #         format_block_content: true
  #         markdown_ignore_labels: [header, footer]
  #         text_recognition_model_name: null
  #         text_detection_model_name: null
  #         layout_detection_model_name: null
  #         extra_options: {}
  #         legacy_ocr_options: {}
