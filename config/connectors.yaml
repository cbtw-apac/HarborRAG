version: 1

connectors:
  harborrag-workspace:
    provider: local
    enabled: true
    environment:
      source_path: LOCAL_SOURCE_PATH
    settings:
      allowed_extensions: [md, markdown, txt, pdf, docx, doc, odt, pptx, csv, xlsx, png, jpg, jpeg, html]
      excluded_extensions: []
      include_paths: []
      exclude_paths: []
      include_globs: []
      exclude_globs: []
      include_hidden: false
      follow_symlinks: false
      max_depth: null
      max_file_size_bytes: 104857600
      checksum_mode: stat
      fail_on_error: false

  confluence-main:
    provider: confluence
    enabled: true
    environment:
      base_url: CONFLUENCE_BASE_URL
      space_key: CONFLUENCE_SPACE_KEY
    settings:
      deployment_type: cloud
      content_types: [page]
      include_labels: []
      exclude_labels: []
      include_comments: true
      include_attachments: true
      max_attachment_size_bytes: 26214400
      allowed_extensions: []
      excluded_extensions: []
      max_comments: 1
      max_attachments: 1000
      fail_on_error: false
      requests_per_minute: 600
      page_size: 100
      request_timeout_seconds: 30
      max_retries: 3
      backoff_factor: 0.5
    secrets:
      token_env: CONFLUENCE_TOKEN
      email_env: CONFLUENCE_EMAIL

  jira-main:
    provider: jira
    enabled: true
    environment:
      base_url: JIRA_BASE_URL
      project_keys: JIRA_PROJECT_KEY
    settings:
      deployment_type: cloud
      issue_types: []
      statuses: []
      labels: []
      include_comments: true
      include_attachments: true
      include_changelog: false
      include_attachment_text_in_content: true
      max_attachment_size_bytes: 26214400
      allowed_extensions: []
      excluded_extensions: []
      max_comments: 1000
      max_attachments: 1000
      max_changelog_items: 1000
      fail_on_error: false
      requests_per_minute: 600
      page_size: 50
      request_timeout_seconds: 30
      max_retries: 3
      backoff_factor: 0.5
    secrets:
      token_env: JIRA_TOKEN
      email_env: JIRA_EMAIL

  sharepoint-main:
    provider: sharepoint
    enabled: true
    environment:
      site_url: SHAREPOINT_SITE_URL
    settings:
      auth_mode: device_code
      root_path: Testing - SharePoint Connector/Folder_contain_unsupportted_file
      graph_api_url: https://graph.microsoft.com/v1.0
      crawl_all_drives: false
      recursive: true
      allowed_extensions: [md]
      excluded_extensions: []
      include_hidden: false
      include_pages: false
      max_file_size_bytes: 104857600
      fail_on_error: false
      requests_per_minute: 120
      page_size: 200
      request_timeout_seconds: 60
      max_retries: 3
      backoff_factor: 0.5
    secrets:
      tenant_id_env: MICROSOFT_TENANT_ID
      client_id_env: MICROSOFT_CLIENT_ID
      # client_secret_env: MICROSOFT_CLIENT_SECRET
