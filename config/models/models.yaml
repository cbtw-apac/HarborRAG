# One catalog for OpenAI and for an OpenAI-compatible gateway such as a LiteLLM proxy.
# Every value comes from env/.env.models; env-example/.env.models.example lists them.
#
#   HARBORRAG_URL             endpoint for every family; OpenAI when unset
#   HARBORRAG_EMBED_PROVIDER  set to "cohere" when the embedding model is a Cohere model
#   HARBORRAG_RERANKER_MODEL  turns reranking on; leave unset to run without it
chat:
  default_model: primary
  backend:
    type: direct_sdk
  timeouts:
    request_seconds: 60
  retry:
    same_deployment_attempts: 2
    max_deployment_failovers: 1
    max_model_fallbacks: 1
  security:
    allowed_providers: [openai, openai_compatible]
  models:
    primary:
      deployments:
        - name: openai-compatible-chat
          provider: openai_compatible
          model: ${HARBORRAG_CHAT_MODEL}
          api_base: ${HARBORRAG_URL:-https://api.openai.com/v1}
          api_key: ${HARBORRAG_CHAT_API_KEY}
          capabilities:
            streaming: true
            structured_output: true
            json_mode: true
            tools: true
            parallel_tools: true

embed:
  default_model: primary
  timeouts:
    request_seconds: 60
  default_batch_size: 64
  security:
    allowed_providers: [openai, openai_compatible, cohere]
  models:
    primary:
      embedding_space: ${HARBORRAG_EMBED_MODEL}
      deployments:
        - name: openai-compatible-embedding
          provider: ${HARBORRAG_EMBED_PROVIDER:-openai_compatible}
          custom_llm_provider: litellm_proxy
          model: ${HARBORRAG_EMBED_MODEL}
          api_base: ${HARBORRAG_URL:-https://api.openai.com/v1}
          api_key: ${HARBORRAG_EMBED_API_KEY}
          expected_dimensions: 1536
          capabilities:
            batch: true
            configurable_dimensions: true
            default_dimensions: 1536
            encoding_format: true
            purpose: true
            supported_purposes: [query, document]

rerank:
  default_model: primary
  security:
    allowed_providers: [litellm_proxy]
  models:
    primary:
      deployments:
        - name: gateway-rerank
          provider: litellm_proxy
          model: ${HARBORRAG_RERANKER_MODEL:-}
          api_base: ${HARBORRAG_URL:-https://api.openai.com/v1}
          api_key: ${HARBORRAG_RERANKER_API_KEY:-}
