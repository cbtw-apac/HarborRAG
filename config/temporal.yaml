version: 1

# Runtime client connection. Keep credentials in HARBORRAG_TEMPORAL_API_KEY;
# secrets are intentionally not accepted from this tracked file.
connection:
  # Temporal gRPC frontend authority; the Web UI on port 8080 is not valid.
  target: localhost:7233
  namespace: harborrag
  identity: harborrag-runtime
  allow_insecure_remote: false
  tls:
    enabled: false
    domain: null

# Each worker replica owns six task-queue workers, and this limit applies to each
# of them: one process runs up to 6 * max_concurrent_activities activities and as
# many default-executor threads (temporal/worker.py thread_pool_size). Keep that
# product at or below HARBORRAG_CONTROL_DB_POOL_SIZE + HARBORRAG_CONTROL_DB_MAX_OVERFLOW.
# Size it to the host, not to I/O latency: on the shared 4-vCPU / 15 GB host a
# document costs ~3.7 CPU-seconds, so throughput tops out near 1 document/s and
# extra slots only add queueing and memory. 12 (72 slots and threads per process,
# 216 across three replicas) drove the host into memory thrash on 2026-10-01 with
# ~32s per document; 4 gives 24 slots per process and 8 parser slots across two
# replicas, which also keeps LiteParse OCR fan-out (parsers.yaml num_workers=3)
# at 24 requests, under the OCR server's in-flight ceiling of 32.
worker:
  identity: harborrag-runtime
  max_concurrent_activities: 4
  max_concurrent_workflow_tasks: 4
  max_concurrent_activity_polls: 2
  max_concurrent_workflow_polls: 2
  graceful_shutdown_seconds: 30

# Queue names appear in the Temporal UI and are shared by API clients and
# workers. Keep them unique and do not rename them while runs are in flight;
# those histories retain their original queue names. Restart API and workers.
task_queues:
  discovery: harborrag-discovery
  transform: harborrag-transform
  io: harborrag-io
  parser: harborrag-parser
  model: harborrag-model
  index: harborrag-index

timeouts:
  discovery_seconds: 43200
  finalization_seconds: 21600

retries:
  discovery:
    initial_interval_seconds: 2
    backoff_coefficient: 2
    maximum_interval_seconds: 60
    maximum_attempts: 8
  document:
    initial_interval_seconds: 2
    backoff_coefficient: 2
    maximum_interval_seconds: 300
    maximum_attempts: 12

ingestion:
  batch_size: 200
  document_concurrency: 8

workflow:
  execution_timeout_seconds: 2592000  # 30 days
  task_timeout_seconds: 10

health:
  timeout_seconds: 5
