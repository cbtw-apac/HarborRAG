# Base chat configuration. It is used when no profile overrides chat settings.
chat:
  # A logical model is an application-facing name, not a provider model ID.
  default_model: chat-primary
  timeout_seconds: 60
  stream_timeout_seconds: 90
  retry:
    # Retry the same provider deployment before selecting another deployment.
    same_deployment_attempts: 2
    # Deployment failovers stay within one logical model.
    max_deployment_failovers: 1
    # Model fallbacks follow the `fallbacks` list below.
    max_model_fallbacks: 1
  models:
    chat-primary:
      # Aliases let callers request this model using another stable name.
      aliases: [assistant]
      fallbacks: [chat-backup]
      default_params:
        temperature: 0.2
        max_completion_tokens: 1024
      deployments:
        - name: openai-primary
          provider: openai
          # This is the provider-facing LiteLLM model identifier.
          model: openai/gpt-4.1-mini
          # Environment references are expanded when the file is loaded.
          api_key: ${OPENAI_API_KEY}
    chat-backup:
      deployments:
        - name: anthropic-backup
          provider: anthropic
          model: anthropic/claude-sonnet-4-5
          api_key: ${ANTHROPIC_API_KEY}

# Embedding settings are independent from chat settings.
embed:
  default_model: embed-primary
  default_batch_size: 128
  models:
    embed-primary:
      aliases: [retrieval-embedding]
      # All fallbacks for an index must use a compatible embedding space.
      embedding_space: retrieval-v1
      default_params:
        purpose: document
        normalize: true
      deployments:
        - name: openai-embedding
          provider: openai
          model: openai/text-embedding-3-small
          api_key: ${OPENAI_API_KEY}
          expected_dimensions: 1536
          max_batch_size: 128

# Reranking always sends the complete candidate set to one deployment.
rerank:
  default_model: rerank-primary
  models:
    rerank-primary:
      aliases: [retrieval-reranker]
      default_params:
        top_n: 10
        return_documents: true
      deployments:
        - name: cohere-rerank
          provider: cohere
          model: cohere/rerank-v3.5
          api_key: ${COHERE_API_KEY}

# Profiles are named, partial overlays on the base configuration above.
# Select one with `from_file("models.example.yaml", profile="local")`.
# A profile only changes the sections it contains; omitted sections keep their base values.
# Nested mappings are deep-merged, so unmentioned base models remain available.
profiles:
  local:
    # This profile selects a local Ollama deployment as the default chat route.
    # Embed and rerank remain unchanged because they are not listed here.
    chat:
      default_model: local-chat
      models:
        local-chat:
          provider: ollama
          model: ollama/llama3.2
          api_base: http://localhost:11434
