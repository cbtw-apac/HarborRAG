# Required by the Temporal server image. Keep local development behavior
# explicit instead of relying on an image-internal dynamic-config path.
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

# Experimental native workflow pause/unpause (server 1.31+). HarborRAG pauses
# runs by signal only; it keeps this on so resume and cancel can natively
# unpause a run an earlier release paused. Without it UnpauseWorkflowExecution
# fails as UNIMPLEMENTED and such a run stays paused.
frontend.WorkflowPauseEnabled:
  - value: true
    constraints:
      namespace: harborrag
