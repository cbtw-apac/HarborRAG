# Required by the Temporal server image. Keep local development behavior
# explicit instead of relying on an image-internal dynamic-config path.
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

# HarborRAG applies native pause to the root execution after it pauses dispatch.
# Keep unpause available for resume and cancellation of native-paused runs.
frontend.WorkflowPauseEnabled:
  - value: true
    constraints:
      namespace: harborrag
