name: harborrag-dev

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      HARBORRAG_ENV: dev
      HARBORRAG_TEMPORAL_TARGET: temporal:7233
      HARBORRAG_TEMPORAL_ALLOW_INSECURE_REMOTE: "true"
      HARBORRAG_TEMPORAL_NAMESPACE: ${HARBORRAG_TEMPORAL_NAMESPACE:-harborrag}
      HARBORRAG_TEMPORAL_IDENTITY: ${HARBORRAG_API_TEMPORAL_IDENTITY:-harborrag-api}
    ports:
      - "${HARBORRAG_API_BIND_ADDRESS:-127.0.0.1}:${HARBORRAG_API_PORT:-8000}:8000"
    init: true
    networks:
      - harborrag-data-network

networks:
  harborrag-data-network:
    name: harborrag-data-network
    external: true
