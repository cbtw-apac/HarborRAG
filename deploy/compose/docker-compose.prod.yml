name: harborrag-prod

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      HARBORRAG_ENV: prod
      HARBORRAG_QDRANT_URL: http://qdrant:6333
      HARBORRAG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    volumes:
      - harbor_prod_state:/app/.harbor

volumes:
  harbor_prod_state:
