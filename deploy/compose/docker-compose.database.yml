services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    environment:
      # Every HTTP and gRPC request must carry this key. Qdrant leaves only its
      # /healthz, /livez and /readyz probes unauthenticated.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in the database environment file}
    ports:
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - harborrag-data-network

  falkordb:
    image: falkordb/falkordb:v4.20.1
    restart: unless-stopped
    environment:
      # GRAPH.CONSTRAINT is asynchronous and cannot be replayed safely from
      # AOF by this FalkorDB release. Persist snapshots in the named volume so
      # constraints and graph data both survive container restarts.
      REDIS_ARGS: "--appendonly no --save 60 1 --requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in the database environment file}"
      # redis-cli reads REDISCLI_AUTH, so the healthcheck authenticates without
      # the password on its command line.
      REDISCLI_AUTH: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in the database environment file}
    ports:
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${FALKORDB_PORT:-6379}:6379"
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${FALKORDB_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      # NOAUTH and WRONGPASS replies exit 0; require the PONG itself.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - harborrag-data-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The password is read from the environment so only its variable name lands
    # in the container's Cmd (docker inspect, ps, compose config).
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDISCLI_AUTH"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the database environment file}
    ports:
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # NOAUTH and WRONGPASS replies exit 0; require the PONG itself.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - harborrag-data-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # Three worker replicas at 36 control-database connections each, plus Temporal,
    # the API and MCP, exceed the stock limit of 100.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the database environment file}
      POSTGRES_DB: ${POSTGRES_DB:-harborrag}
    ports:
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - harborrag-data-network

  minio:
    # Chainguard's free tier publishes only :latest, so it is pinned by digest. Runs as
    # uid 65532; the image's /data is world-writable, so a fresh volume needs no chown.
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-harborrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the database environment file}
    ports:
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${HARBORRAG_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - harborrag-data-network

  # One-shot: create the HarborRAG buckets and a least-privilege application key
  # (policy deploy/minio/harborrag-app-policy.json), so the API, worker and MCP
  # server never hold the MinIO root credentials. scripts/deployment/dev.sh runs
  # it to completion after the data stack starts; rerunning it is safe.
  minio-init:
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/usr/bin/bash", "-ec"]
    environment:
      # mc keeps its configuration under HOME; the image runs as uid 65532.
      HOME: /tmp
      # mc reads the admin alias from MC_HOST_<alias>, which keeps the root
      # password out of every process argument list.
      MC_HOST_harbor: http://${MINIO_ROOT_USER:-harborrag}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the database environment file}@minio:9000
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-harborrag-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in the database environment file}
    command:
      - |
        mc mb --ignore-existing harbor/harborrag-raw harbor/harborrag-artifacts
        mc admin policy create harbor harborrag-app /etc/harborrag/minio-app-policy.json
        # printf is a bash builtin: the secret reaches mc on stdin, never argv.
        printf '%s\n' "$${MINIO_APP_SECRET_KEY}" | mc admin user add harbor "$${MINIO_APP_ACCESS_KEY}"
        user_info="$$(mc admin user info harbor "$${MINIO_APP_ACCESS_KEY}" --json)"
        if [[ "$${user_info}" != *'"harborrag-app"'* ]]; then
          mc admin policy attach harbor harborrag-app --user "$${MINIO_APP_ACCESS_KEY}"
        fi
        echo "MinIO buckets and the HarborRAG application key are ready."
    volumes:
      - ../minio/harborrag-app-policy.json:/etc/harborrag/minio-app-policy.json:ro
    networks:
      - harborrag-data-network
    restart: "no"

networks:
  harborrag-data-network:
    name: harborrag-data-network
    driver: bridge

volumes:
  qdrant_data:
  falkordb_data:
  redis_data:
  pg_data:
  minio_data:
