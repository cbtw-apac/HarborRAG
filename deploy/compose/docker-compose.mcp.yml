name: harborrag-mcp

services:
  mcp:
    image: ${HARBORRAG_MCP_IMAGE:-harborrag-mcp-mcp}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.mcp
      args:
        HARBORRAG_GIT_REVISION: ${HARBORRAG_GIT_REVISION:-unknown}
    command: ["--http"]
    env_file:
      - path: ${HARBORRAG_MCP_ENV_FILE:-../../env/.env.mcp}
        required: true
      - path: ${HARBORRAG_MODEL_ENV_FILE:-../../env/.env.models}
        required: false
    environment:
      HARBORRAG_ENV: ${HARBORRAG_ENV:-dev}
      # The container listens on every interface of its own network, which the
      # server accepts only when acknowledged in a dev environment. Docker publishes
      # the port on loopback only, so do not widen the "ports" mapping below. The
      # server turns away browsers that reach it under any other host name.
      HARBORRAG_MCP_HOST: 0.0.0.0
      HARBORRAG_MCP_PORT: "8010"
      HARBORRAG_MCP_ALLOW_INSECURE_BIND: "true"
      HARBORRAG_MCP_ALLOWED_HOSTS: "127.0.0.1,localhost"
      HARBORRAG_MCP_CONFIG_PATH: /app/config/mcp/server.yaml
      HARBORRAG_MODEL_CONFIG_PATH: /app/config/models/models.yaml
      HARBORRAG_MCP_AUDIT_PATH: /var/lib/harborrag/.harborrag/mcp-audit.jsonl
      # The server reads with its own accounts: the read-only harborrag_mcp role and
      # the harborrag-mcp MinIO user, which 'scripts/deployment/dev.sh mcp-access'
      # creates. It never gets the Postgres owner or the MinIO root credentials.
      HARBORRAG_CONTROL_DB_URL: postgresql+asyncpg://harborrag_mcp:${POSTGRES_MCP_PASSWORD:?run scripts/deployment/dev.sh mcp-access to set POSTGRES_MCP_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in the database environment file}
      # The backends are fixed names on the data network. The plaintext
      # acknowledgements apply to those names only, so the addresses are not
      # variables that an override could point at a remote host.
      HARBORRAG_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      HARBORRAG_OBJECT_STORE_ALLOW_INSECURE_REMOTE: "true"
      HARBORRAG_OBJECT_STORE_ACCESS_KEY_ID: harborrag-mcp
      HARBORRAG_OBJECT_STORE_SECRET_ACCESS_KEY: ${MINIO_MCP_PASSWORD:?run scripts/deployment/dev.sh mcp-access to set MINIO_MCP_PASSWORD}
      HARBORRAG_QDRANT_URL: http://qdrant:6333
      HARBORRAG_QDRANT_ALLOW_INSECURE_REMOTE: "true"
      HARBORRAG_FALKORDB_HOST: falkordb
      HARBORRAG_FALKORDB_PORT: "6379"
      HARBORRAG_FALKORDB_ALLOW_INSECURE_REMOTE: "true"
      HARBORRAG_FALKORDB_MAX_CONNECTIONS: ${HARBORRAG_FALKORDB_MAX_CONNECTIONS:-32}
    ports:
      - "127.0.0.1:${HARBORRAG_MCP_PORT:-8010}:8010"
    networks:
      - harborrag-data-network
    volumes:
      - ../../config:/app/config:ro
      - harborrag_mcp_audit:/var/lib/harborrag/.harborrag
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys,os;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:'+os.environ.get('HARBORRAG_MCP_PORT','8010')+'/healthz',
          timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    init: true
    stop_grace_period: 30s
    # Comes back after Docker or the host restarts. The launcher's preflight keeps
    # a server that cannot start from being started at all.
    restart: unless-stopped

networks:
  harborrag-data-network:
    name: harborrag-data-network
    external: true

volumes:
  harborrag_mcp_audit:
    name: harborrag-mcp-audit
