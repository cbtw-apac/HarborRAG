global:
  scrape_interval: 15s

scrape_configs:
  - job_name: harborrag-ingestion-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal-worker:9464"]

  # GET /api/v1/metrics requires an admin bearer token whenever
  # HARBORRAG_AUTH_MODE is not "none" (see api/README.md); add a
  # `bearer_token_file` here when scraping a non-dev deployment.
  - job_name: harborrag-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
