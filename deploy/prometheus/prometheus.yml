global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/harborrag_alerts.yml

scrape_configs:
  - job_name: harborrag-ingestion-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal-worker:9464"]
  - job_name: harborrag-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/api-scrape-token
    static_configs:
      - targets: ["api:9465"]
