global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/harborrag_alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: harborrag-ingestion-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal-worker:9464"]
  - job_name: harborrag-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api-scrape-token
    static_configs:
      - targets: ["api:9465"]
  # OTLP metrics, span metrics and the MCP health probe from the OpenTelemetry
  # collector. OpenMetrics comes first so exemplars (trace ids) arrive, and the
  # collector's job and instance labels name the service that sent each series.
  - job_name: otel-collector
    honor_labels: true
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
