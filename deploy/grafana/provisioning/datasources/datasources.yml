apiVersion: 1

# Fixed uids let dashboards and the links between traces, logs and metrics refer to
# each data source. Grafana expands $NAME from its environment in this file, so a
# literal $ in a link template is written $$.
datasources:
  - name: Prometheus
    uid: harborrag-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: harborrag-tempo
  - name: Loki
    uid: harborrag-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: harborrag-tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
  - name: Tempo
    uid: harborrag-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: harborrag-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: harborrag-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: harborrag-prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: harborrag-loki

# Earlier releases provisioned a PostgreSQL data source that logged in as the retired
# harborrag_observer role. Grafana keeps a provisioned data source in its database after
# it leaves this file, so delete it by name.
deleteDatasources:
  - name: PostgreSQL
    orgId: 1
