[project]
name = "harborrag-memory"
version = "0.1.0"
description = "Scope-aware short-term, working, and long-term memory for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_memory"]
