[project]
name = "harborrag-memory"
version = "2.0.0a1"
description = "Scope-aware short-term, working, and long-term memory for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["harborrag-core==2.0.0a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_memory"]
