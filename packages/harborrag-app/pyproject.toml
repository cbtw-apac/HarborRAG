[project]
name = "harborrag-app"
version = "0.1.0"
description = "CLI and API package boundary for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==0.1.0", "harborrag-runtime==0.1.0"]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
    "sse-starlette>=2.1",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_app"]
