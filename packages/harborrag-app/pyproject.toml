[project]
name = "harborrag-app"
version = "0.1.0"
description = "CLI and API package boundary for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0",
    "harborrag-runtime==0.1.0",
    "pydantic>=2.13,<3",
    "rich>=14,<16",
    "textual>=8.2,<9",
    "typer>=0.24,<0.27",
]

[project.scripts]
harborrag = "harborrag_app.cli.main:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
    "sse-starlette>=2.1",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_app"]
