[project]
name = "harborrag-app"
version = "2.0.0"
description = "CLI and API package boundary for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==2.0.0",
    "harborrag-runtime==2.0.0",
    "pydantic>=2.13,<3",
    "python-dotenv>=1,<2",
    "rich>=14,<16",
    "textual>=8.2,<9",
    "typer>=0.24,<0.27",
]

[project.scripts]
harborrag = "harborrag_app.cli.main:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "harborrag-runtime[temporal]==2.0.0",
    "prometheus-client>=0.19,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
    "sse-starlette>=2.1",
    "websockets>=12",
]
production = [
    "harborrag-adapters[control-plane,falkordb,llm,postgres,qdrant,s3]==2.0.0",
    "harborrag-runtime[temporal]==2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_app"]
