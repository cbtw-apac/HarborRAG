[project]
name = "harborrag"
version = "0.1.0"
description = "Meta-package public facade for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HarborRAG Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "harborrag-core==0.1.0",
    "harborrag-runtime==0.1.0",
]

[project.urls]
Homepage = "https://github.com/harborrag/harborrag"
Repository = "https://github.com/harborrag/harborrag"
Issues = "https://github.com/harborrag/harborrag/issues"

[project.optional-dependencies]
local = [
    "harborrag-adapters[chunking,control-plane,falkordb,llm,parsers,pdf-docling,qdrant,s3,tables]==0.1.0",
]
chat = ["harborrag-adapters[llm]==0.1.0"]
cli = ["harborrag-app==0.1.0"]
memory = ["harborrag-memory==0.1.0"]
server = [
    "harborrag-app[api]==0.1.0",
    "harborrag-runtime[production,temporal]==0.1.0",
]
temporal = ["harborrag-runtime[temporal]==0.1.0"]
mcp = ["harborrag-mcp-server[mcp]==0.1.0"]
qdrant = ["harborrag-adapters[qdrant]==0.1.0"]
falkordb = ["harborrag-adapters[falkordb]==0.1.0"]
postgres = ["harborrag-adapters[control-plane,postgres]==0.1.0"]
s3 = ["harborrag-adapters[s3]==0.1.0"]
redis = ["harborrag-adapters[redis]==0.1.0"]
all = [
    "harborrag-adapters[parsers-all]==0.1.0",
    "harborrag-app[api]==0.1.0",
    "harborrag-mcp-server[mcp]==0.1.0",
    "harborrag-memory==0.1.0",
    "harborrag-runtime[production,temporal]==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag"]
