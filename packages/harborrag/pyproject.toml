[project]
name = "harborrag"
version = "2.0.0a2"
description = "Meta-package public facade for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HarborRAG Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # ``harborrag-app`` is listed although the facade never imports it: it owns the
    # ``harborrag`` console script, so it is what makes ``pip install harborrag``
    # yield a usable command. ``harborrag-mcp-server`` does not belong here -- it
    # carries fastmcp and jsonschema, which no base install should pull in, and the
    # ``mcp`` extra already reaches it.
    "harborrag-app==2.0.0a2",
    "harborrag-core==2.0.0a2",
    "harborrag-runtime==2.0.0a2",
]

[project.urls]
Homepage = "https://github.com/cbtw-apac/HarborRAG"
Repository = "https://github.com/cbtw-apac/HarborRAG"
Issues = "https://github.com/cbtw-apac/HarborRAG/issues"

[project.optional-dependencies]
local = [
    "harborrag-adapters[chunking,control-plane,falkordb,llm,parsers,pdf-liteparse,qdrant,s3,tables]==2.0.0a2",
]
chat = ["harborrag-adapters[llm]==2.0.0a2"]
cli = ["harborrag-app==2.0.0a2"]
memory = ["harborrag-memory==2.0.0a2"]
server = [
    "harborrag-app[api]==2.0.0a2",
    "harborrag-runtime[reader]==2.0.0a2",
]
temporal = ["harborrag-runtime[temporal]==2.0.0a2"]
mcp = ["harborrag-mcp-server[reader]==2.0.0a2"]
qdrant = ["harborrag-adapters[qdrant]==2.0.0a2"]
falkordb = ["harborrag-adapters[falkordb]==2.0.0a2"]
postgres = ["harborrag-adapters[control-plane,postgres]==2.0.0a2"]
s3 = ["harborrag-adapters[s3]==2.0.0a2"]
redis = ["harborrag-adapters[redis]==2.0.0a2"]
all = [
    "harborrag-adapters[parsers-all]==2.0.0a2",
    "harborrag-app[api]==2.0.0a2",
    "harborrag-mcp-server[mcp]==2.0.0a2",
    "harborrag-memory==2.0.0a2",
    "harborrag-runtime[production,temporal]==2.0.0a2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag"]
