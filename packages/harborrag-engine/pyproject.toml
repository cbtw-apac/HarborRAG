[project]
name = "harborrag-engine"
version = "2.0.0a1"
description = "Ingestion and retrieval orchestration for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["harborrag-core==2.0.0a1", "harborrag-memory==2.0.0a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_engine"]
