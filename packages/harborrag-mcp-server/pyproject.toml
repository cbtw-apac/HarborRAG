[project]
name = "harborrag-mcp-server"
version = "2.0.0a1"
description = "MCP facade and audited tools for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "harborrag-core==2.0.0a1",
    "harborrag-runtime==2.0.0a1",
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
harborrag-mcp = "harborrag_mcp_server.__main__:main"

[project.optional-dependencies]
mcp = ["fastmcp>=3.4,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_mcp_server"]
