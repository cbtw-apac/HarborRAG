[project]
name = "harborrag-mcp-server"
version = "2.0.0a1"
description = "MCP facade and audited tools for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "harborrag-core==2.0.0a1",
    "harborrag-runtime==2.0.0a1",
    "harborrag-engine==2.0.0a1",
    "fastmcp>=4.0.10,<5",
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
harborrag-mcp = "harborrag_mcp_server.__main__:main"
harborrag-mcp-ui = "harborrag_mcp_server.__main__:ui_main"

[project.optional-dependencies]
mcp = []
reader = ["harborrag-runtime[reader]==2.0.0a1"]
# The optional Explorer MCP UI server (harborrag-mcp-ui): FastMCP Apps and Prefab.
# The reader server never imports it.
ui = ["fastmcp[apps]>=4.0.10,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_mcp_server"]
