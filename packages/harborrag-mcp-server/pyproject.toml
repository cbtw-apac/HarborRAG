[project]
name = "harborrag-mcp-server"
version = "0.1.0"
description = "MCP facade and audited tools for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
mcp = ["fastmcp>=3.4,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_mcp_server"]
