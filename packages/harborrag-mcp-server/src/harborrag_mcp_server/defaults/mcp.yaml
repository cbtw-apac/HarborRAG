version: 1

policy:
  max_results: 20
  max_argument_bytes: 65536
  max_output_bytes: 1048576
  allow_ingestion: false

tools:
  vector_search:
    enabled: true
    defaults:
      top_k: 5
    limits:
      top_k: 20
  fetch_evidence:
    enabled: true
  get_document_context:
    enabled: true
    defaults:
      limit: 10
      include_outline: false
    limits:
      limit: 10
  list_sources:
    enabled: true
    defaults:
      limit: 20
    limits:
      limit: 20
  describe_graph:
    enabled: true
  graph_triplet_search:
    enabled: true
    defaults:
      limit: 10
    limits:
      limit: 20
  graph_subgraph_search:
    enabled: true
    defaults:
      max_depth: 2
      max_nodes: 20
      direction: both
    limits:
      max_depth: 4
      max_nodes: 20
  graph_path_search:
    enabled: true
    defaults:
      max_depth: 4
      max_paths: 5
      direction: both
    limits:
      max_depth: 4
      max_paths: 5
  resolve_graph_nodes:
    enabled: true
    defaults:
      limit: 5
    limits:
      limit: 10

tenants: {}
