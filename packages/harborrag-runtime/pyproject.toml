[project]
name = "harborrag-runtime"
version = "0.1.0"
description = "Production composition and durable Temporal ingestion workflows for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0",
    "harborrag-engine==0.1.0",
    "harborrag-adapters==0.1.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.2",
    "temporalio>=1.30,<2",
]

[project.optional-dependencies]
production = [
    "harborrag-adapters[chunking,control-plane,falkordb,llm,parsers,pdf,qdrant]==0.1.0",
]
dev = [
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_runtime"]
