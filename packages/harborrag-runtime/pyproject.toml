[project]
name = "harborrag-runtime"
version = "0.1.0"
description = "Runtime composition, local job state, schedules, and future durable workflows for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0",
    "harborrag-engine==0.1.0",
    "harborrag-adapters==0.1.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
production = [
    "pydantic-settings>=2.2",
    "harborrag-adapters[control-plane]==0.1.0",
]
dev = [
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_runtime"]
