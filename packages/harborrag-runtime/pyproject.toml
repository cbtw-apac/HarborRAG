[project]
name = "harborrag-runtime"
version = "0.1.0"
description = "Direct and durable production execution for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0",
    "harborrag-engine==0.1.0",
    "harborrag-adapters==0.1.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.2",
    "opentelemetry-api>=1.43,<2",
    "prometheus-client>=0.19,<1",
]

[project.optional-dependencies]
temporal = [
    "temporalio>=1.30,<2",
    "cloudpickle>=3.1,<4",
]
production = [
    "harborrag-adapters[chunking,control-plane,falkordb,langfuse,llm,opentelemetry,parsers,pdf-docling,postgres,qdrant,redis,s3,tables]==0.1.0",
]
dev = [
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_runtime"]
