[project]
name = "harborrag-adapters"
version = "0.1.0"
description = "Provider adapters for HarborRAG."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "harborrag-core==0.1.0",
    "requests>=2.28.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
chunking = ["langchain-text-splitters>=1.1,<2"]
control-plane = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "aiosqlite>=0.20,<1",
    "greenlet>=3",
]
redis = ["redis>=5,<6"]
s3 = ["aioboto3>=13,<14"]
qdrant = ["qdrant-client>=1.10,<2"]
falkordb = ["falkordb>=1.0,<2"]
postgres = ["asyncpg>=0.30,<1"]
parsers = [
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "docx2txt>=0.9",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.0",
    "xlrd>=2.0.1",
]
pdf = [
    "PyMuPDF>=1.24.0",
    "docling>=2.0.0",
    "liteparse>=2.5.0",
    "mineru[all]>=2.0.0",
    "onnxruntime>=1.20,<2",
    "paddleocr>=3.0.0",
    "rapidocr>=3.1,<4",
]
pdf-docling = [
    "docling>=2.0.0",
    "onnxruntime>=1.20,<2",
    "rapidocr>=3.1,<4",
]
llm = [
    "litellm>=1.90.0,<1.92.0",
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
]
langfuse = ["langfuse>=4,<5"]
opentelemetry = [
    "opentelemetry-api>=1.43,<2",
    "opentelemetry-sdk>=1.43,<2",
]
test = [
    "litellm>=1.90.0,<1.92.0",
    "opentelemetry-api>=1.43,<2",
    "opentelemetry-sdk>=1.43,<2",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1,<2",
]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "types-PyYAML>=6.0,<7",
    "types-openpyxl>=3.1,<4",
    "types-xlrd>=2.0,<3",
    "types-defusedxml>=0.7,<1",
    "types-hvac>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborrag_adapters"]
