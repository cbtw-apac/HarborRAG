# CodeRabbit configuration for the HarborRAG Python monorepo.
# Place this file at repository root as `.coderabbit.yaml`.
# Schema reference: https://docs.coderabbit.ai/reference/configuration

language: "en-US"

tone_instructions: >
  Be direct, precise, and engineering-focused. Prioritize correctness, package
  boundaries, security, resource safety, concurrency, provider lifecycle, and
  test coverage. Ignore formatting handled by tooling. Give each issue a fix
  and brief rationale.

reviews:
  profile: assertive
  request_changes_workflow: true
  review_status: true
  high_level_summary: true
  review_details: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
      - dev/v2.0.0
      - release/.*
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
      - github-actions[bot]
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5

  path_filters:
    - "**/*"
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/env/**"
    - "!**/.tox/**"
    - "!**/.mypy_cache/**"
    - "!**/.ruff_cache/**"
    - "!**/.pytest_cache/**"
    - "!**/__pycache__/**"
    - "!**/.egg-info/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/htmlcov/**"
    - "!**/.coverage"
    - "!**/coverage.xml"
    - "!**/*.lock"
    - "!**/*.zip"
    - "!**/*.tar"
    - "!**/*.tar.gz"
    - "!**/*.whl"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.pdf"
    - "!**/*.svg"
    # Vendored icon/JS/CSS library - pre-commit excludes it from formatting too.
    - "!website/assets/**"
    # Generated documentation site output.
    - "!site/**"

  high_level_summary_instructions: >
    Summarize: (1) which HarborRAG package boundaries are touched,
    (2) whether public contracts/base classes changed, (3) whether affected
    tests and test doubles were updated, (4) whether coverage remains at least 90%,
    and (5) any security, async, resource-lifecycle, or dependency-direction risk.
    Keep it under 180 words.

  auto_apply_labels: true
  labeling_instructions:
    - label: "pkg:core"
      instructions: "Apply when packages/harborrag-core is changed."
    - label: "pkg:adapters"
      instructions: "Apply when packages/harborrag-adapters is changed."
    - label: "pkg:engine"
      instructions: "Apply when packages/harborrag-engine is changed."
    - label: "pkg:runtime"
      instructions: "Apply when packages/harborrag-runtime is changed."
    - label: "pkg:memory"
      instructions: "Apply when packages/harborrag-memory is changed."
    - label: "pkg:app"
      instructions: "Apply when packages/harborrag-app is changed."
    - label: "pkg:mcp"
      instructions: "Apply when packages/harborrag-mcp-server is changed."
    - label: "area:docs"
      instructions: >
        Apply when docs/, website/, or any published README changes. See
        website/README.md for which sources reach the documentation website.
    - label: "area:ci"
      instructions: "Apply when .github/workflows, Makefile, or pre-commit config changes."
    - label: "area:deploy"
      instructions: "Apply when deploy/ or scripts/deployment changes."

  auto_title_instructions: >
    Follow Conventional Commits: type(scope): description.
    Valid types: feat, fix, refactor, perf, test, docs, ci, chore.
    Scope should be the package or feature family, for example core, adapters,
    connectors, parsers, repositories, engine, runtime, app, mcp, tests, ci.

  path_instructions:
    - path: "packages/harborrag-core/src/harborrag_core/**"
      instructions: >
        Core is the pure contract/domain layer. Verify that it does not import
        harborrag_adapters, harborrag_engine, harborrag_runtime, harborrag_app,
        harborrag_mcp_server, or the meta-package. New domain objects should be
        small, deterministic, typed, and dependency-light. Flag provider SDK
        imports, network calls, filesystem side effects, environment reads, or
        concrete adapter references.
        Under ports/: Protocol or abstract boundaries only - no provider-specific
        implementation logic, concrete registry lookup, hardcoded SDK types, HTTP
        clients, database clients, or cloud credentials. When a port changes,
        require corresponding fake-based tests under packages/harborrag-core/tests
        and updates to any affected adapter test doubles.
        Under security/: this is a trust boundary. Check that secret redaction
        covers api_key, token, password, secret, credential, Authorization
        Bearer, and common cloud/API key forms. URL policy must reject unsafe
        schemes and make SSRF-prone host handling explicit. Do not allow secrets
        in repr, logs, exception messages, or serialized diagnostics.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/connectors/**"
      instructions: >
        Connectors must normalize external sources into core RawDocument or
        SourceRecord shapes. Base contracts stay in this folder; production
        implementations belong in provider modules and their fakes under tests/. When adding real connectors, require explicit authentication
        handling, pagination termination, retry/rate-limit strategy, timeout,
        session cleanup, source metadata, stable IDs, and secret redaction. Flag
        raw requests without timeout, unbounded directory crawls, path traversal,
        shell command construction, and connector code that bypasses core ports.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/parsers/**"
      instructions: >
        Parsers convert raw content into ParsedDocument without doing ingestion
        orchestration. Base contracts stay in this folder; production
        implementations belong in format modules and their fakes under tests/.
        Check file-size guards, temp-file cleanup, subprocess timeouts, parser
        fallback behavior, parse quality metadata, and preservation of structured
        elements. For PDF/Office engines, flag unbounded memory reads, unsafe
        shell calls, missing fallback warnings, and provider raw payload leakage
        outside explicit diagnostic fields.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/models/**"
      instructions: >
        Model adapters must implement chat, embedding, or reranker boundaries.
        Check provider-local capability profiles, optional dependency errors with
        install hints, timeout/retry/rate-limit behavior, deterministic fake
        outputs in tests, and no provider SDK imports outside adapters. Raw provider
        responses must not appear in default outputs except debug/raw diagnostic
        fields.

    - path: "packages/harborrag-adapters/src/harborrag_adapters/repositories/**"
      instructions: >
        This is the storage adapter layer. Use repositories/ naming, not stores/.
        Each family folder - vector, graph, cache, object_store, database, and
        state when added - exposes provider-neutral Harbor* contracts plus real
        provider packages. Production repository packages do not ship mock
        backends; deterministic fakes belong under tests/. Check
        connection lifecycle, transaction boundaries, parameterized SQL, object
        path traversal prevention, cache TTL semantics, vector namespace support,
        graph relationship normalization, and missing optional dependency errors.

    - path: "packages/harborrag-engine/src/harborrag_engine/ingestion/**"
      instructions: >
        Ingestion orchestrates connector -> parser -> normalization -> chunking
        -> indexing through ports/base classes. It must not import concrete
        provider SDKs or adapter clients directly. Check error propagation,
        checkpoint semantics, duplicate handling, graph hint preservation,
        object artifact writing boundaries, and that broad exceptions are either
        converted to structured run errors or deliberately re-raised.

    - path: "packages/harborrag-engine/src/harborrag_engine/retrieval/**"
      instructions: >
        Retrieval owns query rewriting, vector/graph search orchestration, score
        fusion, reranking, and context reconstruction. Check deterministic score
        combination, stable ordering for equal scores, top_k handling, no hidden
        provider dependencies, no mutation of input results unless documented,
        and tests for empty, duplicate, tie-score, and low-score cases.

    - path: "packages/harborrag-runtime/src/harborrag_runtime/**"
      instructions: >
        Runtime owns process boundaries, jobs, schedules, supervisors, and future
        Temporal integration. It must not contain domain-specific ingestion or
        retrieval business logic. Check bounded worker counts, job-state
        transitions, cancellation, retry policy, schedule persistence, and no
        blocking I/O inside future async workers. Temporal placeholders should
        remain optional and must not become required imports for local runtime.

    - path: "packages/harborrag-app/src/harborrag_app/api/**"
      instructions: >
        API code is the external HTTP boundary. When FastAPI or another framework
        is added, route handlers must validate inputs with explicit request
        schemas, return stable error envelopes, avoid leaking stack traces or
        secrets, and call runtime/engine service facades rather than raw adapters.
        Any new route needs package-local tests under packages/harborrag-app/tests.

    - path: "packages/harborrag-app/src/harborrag_app/cli/**"
      instructions: >
        CLI commands must support JSON output for automation, deterministic exit
        codes, sanitized errors, and no stack traces unless an explicit debug flag
        is set. Check that command implementations call app/runtime services, not
        raw adapters, and that new commands update README and tests.

    - path: "packages/harborrag-mcp-server/src/harborrag_mcp_server/**"
      instructions: >
        MCP exposes an audited service-only facade for agents. Tools must have
        explicit input/output schemas, capability budgets, sanitized errors, and
        audit entries. Do not expose raw vector DB, graph DB, cache, object store,
        or SQL execution tools directly. Any new tool must include a
        fake-backed server test and must call app/runtime services through a
        safe boundary.

    - path: "packages/harborrag*/tests/**"
      instructions: >
        Every package owns its own tests. New base classes require abstract/base
        behavior tests; new providers require fake-client tests and optional
        integration tests. Test doubles live here, not in src/ - shared fakes go
        in harborrag_core.testing. Avoid brittle sleep-based tests. Keep coverage
        at or above 90% for the repo.

    - path: "tests/**"
      instructions: >
        Root tests should cover cross-package behavior: import smoke tests,
        dependency-direction rules, CLI smoke, and integration contracts. Do not
        duplicate package-local unit tests here. If a cross-package rule changes,
        explain why in the PR description.

    - path: "scripts/**"
      instructions: >
        Scripts must be safe for local developer use. Check repo-root discovery,
        no shell=True with user input, helpful JSON output where relevant,
        deterministic exit codes, and no writes outside the repository unless an
        explicit output path is provided and validated.

    - path: ".github/workflows/**"
      instructions: >
        Check GitHub Actions for least-privilege permissions, pinned action
        versions, no pull_request_target for untrusted code, no secrets exposed
        to fork PRs, concurrency groups for long jobs, Python 3.12 consistency,
        and commands matching Makefile/pyproject configuration.

    - path: "pyproject.toml"
      instructions: >
        Root pyproject is the workspace/tooling source of truth. Check Python
        requires-python is >=3.12, uv workspace members include every package,
        dev/docs dependencies are not placed in main dependencies, coverage omit
        excludes tests/build artifacts, Ruff/mypy agree on Python version and
        line length, and pytest discovers package-local tests.

    - path: "packages/*/pyproject.toml"
      instructions: >
        Package pyproject files must use Python >=3.12 and declare only required
        runtime dependencies. Do not add provider SDK dependencies to core. Keep
        optional provider dependencies in adapter extras. Package names should
        match workspace membership and README ownership.

    - path: "README.md"
      instructions: >
        Root README should onboard open-source contributors. Check that package
        map, quickstart commands, current status, testing instructions, and
        architecture boundaries match the actual repository structure. Avoid
        claiming implemented providers that are only TODO or placeholders.

    - path: "packages/*/README.md"
      instructions: >
        Package README files should explain ownership, public API, base
        contracts, teammate deliverables, and boundary rules for that package.
        Each is also the package's PyPI project page, so links must be absolute.
        See website/README.md for the expected structure.

  pre_merge_checks:
    title:
      mode: warning
      requirements: >
        PR title should follow Conventional Commits: type(scope): description.
        Valid types: feat, fix, refactor, perf, test, docs, ci, chore.
    description:
      mode: warning
    custom_checks:
      # Production packages no longer ship mock.py modules. Fakes and test
      # doubles live under each package's tests/, or in harborrag_core.testing
      # when shared. See "File ownership and test doubles" in
      # packages/harborrag-adapters/README.md.
      - name: "No production mock modules"
        mode: error
        instructions: >
          Fail if a mock.py module, or a mock/fake provider backend, is added
          under a packages/<name>/src tree outside a testing/ package.
          Deterministic fakes and test doubles belong under that package's
          tests/ directory; shared fakes belong in an explicit testing/ package
          such as harborrag_core.testing, which is a supported location.

      - name: "No hardcoded credentials"
        mode: error
        instructions: >
          Fail if any hardcoded API key, token, password, secret, credential,
          Authorization header, GitHub token, OpenAI key, cloud key, database
          password, or bearer token appears in non-test source code.

      # Dependency direction, provider-SDK placement, and the coverage gate are
      # enforced deterministically by lint-imports, check_dependency_direction.py,
      # and the pytest coverage gate. `github-checks` below reads those results,
      # so restating them here as LLM-evaluated checks adds latency, not signal.
      - name: "Coverage gate preserved"
        mode: warning
        instructions: >
          Warn if a change lowers coverage fail_under in pyproject.toml below 90
          (the repository-wide gate), lowers --cov-fail-under below 85 for the
          website suite in .github/workflows/test.yml, or stops running
          package-local tests.

      - name: "Package-local test coverage"
        mode: warning
        instructions: >
          When production code changes under packages/<name>/src without any
          matching change under packages/<name>/tests, note it and say which
          behaviour is now untested. Do not flag changes that cannot alter
          behaviour - refactors with unchanged semantics, type-only edits,
          docstrings, comments, logging text, renames covered by existing tests,
          or changes already exercised by the repository coverage gate.


  tools:
    # Every CodeRabbit tool except ast-grep is enabled by default, so only
    # deviations from the default belong here.

    # Disabled: these overlap tooling this repository already runs and would
    # report the same findings twice. `github-checks` below reads the real
    # results from the Quality Gates workflow.
    ruff:
      enabled: false          # make lint (ruff format --check + ruff check)
    pylint:
      enabled: false          # ruff is the configured Python linter
    flake8:
      enabled: false          # ruff is the configured Python linter
    osvScanner:
      enabled: false          # pip-audit runs against the locked dependencies
    languagetool:
      enabled: false          # prose style is not gated in this repository

    # Wait long enough for the Quality Gates and Test workflows to finish.
    github-checks:
      enabled: true
      timeout_ms: 900000

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "packages/*/README.md"
      # Package README structure, the documentation publication boundary, and
      # the build/deploy contract for the documentation site.
      - "website/README.md"
      # Architecture, testing, release, and publication conventions.
      - "docs/developers/**/*.md"
  learnings:
    scope: local
    approval_delay: 7
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "packages/harborrag-core/src/harborrag_core/**"
        instructions: >
          Generate docstrings only when they clarify public contracts or tricky
          invariants. Keep them concise and avoid restating type annotations.
      - path: "packages/harborrag-adapters/src/harborrag_adapters/**"
        instructions: >
          Mention provider lifecycle expectations, optional dependency behavior,
          and whether the class is a base contract or a real adapter.
  unit_tests:
    path_instructions:
      - path: "packages/*/src/**"
        instructions: >
          Add package-local tests under the matching packages/<name>/tests
          directory. Cover happy path, empty input, error path, and boundary rule.

chat:
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
