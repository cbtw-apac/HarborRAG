<style>
  /* ── docs-index page styles ── */
  .dh-hero {
    max-width: 80rem;
    margin-inline: auto;
    padding: 80px 20px;
    text-align: center;
    color: #0f172a;
  }
  .dh-hero h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    font-family: var(--font-family);
  }

  .dh-hero p {
    max-width: 42rem;
    margin: 0 auto 0;
    color: #475569;
    font-size: 1.25rem;
    font-family: var(--second-family);
  }

  .docs-nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
    align-items: start;
    gap: 2rem;
    max-width: 1170px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  .docs-nav-card {
    background: #fff;
    border: 1px solid #ebedf0;
    border-radius: 20px;
    padding: 1.5rem;
  }
  .docs-nav-card h2 {
    margin: 0 0 1rem;
    font-size: 1.5rem;
  }
  .docs-nav-card ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .docs-nav-card li + li {
    border-top: 1px solid #ebedf0;
  }
  .docs-nav-card a {
    display: block;
    padding: 0.5rem 0;
    color: var(--text-color-primary-text-black);
  }

  /* quick actions section */
  .dh-quickactions {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 10rem 0;
  }
  .dh-quickactions-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .dh-quickactions-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 100%;
    max-width: 1170px;
    margin-inline: auto;
    text-align: center;
    z-index: 1;
    gap: 80px;
  }
  .dh-quickactions-inner h3 {
    color: var(--text-color-white);
    margin: 0;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 48px;
    text-align: center;
  }
  .dh-qa-btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 32px;
  }
  .dh-qa-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.46rem;
    border-radius: 9999px;
    padding: 1.25rem 2rem;
    border: 1px solid transparent;
    font-size: 1.125rem;
    font-weight: 500;
    text-decoration: none;
    line-height: 1;
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
    color: var(--secondary-color);
  }

  .dh-qa-btn-primary {
    background: var(--primary-color);
  }

  .dh-qa-btn-secondary {
    background: #fff;
  }

  .dh-qa-btn svg {
    width: 1.5rem;
    height: 1.5rem;
    flex-shrink: 0;
  }
  .dh-qa-btn:hover, .dh-qa-btn:focus {
    opacity: .92;
    transform: translateY(-1px);
    background: linear-gradient(90deg, #4dd9ff 0%, #38e8c3 100%);
    color: #062335;
    border-color: rgba(77, 217, 255, 0.78);
  }

  @media (max-width: 767px) {
    .dh-quickactions {
      min-height: 0;
      padding: 2.5rem 0 2.75rem;
    }

    .dh-quickactions-inner {
      padding: 0 2rem;
      gap: 24px;
    }
    .dh-quickactions-inner h3 {
      font-size: clamp(1.875rem, 8vw, 2.25rem);
    }
    .dh-qa-btns {
      gap: 1rem;
    }
    .dh-qa-btn {
      width: 100%;
      justify-content: center;
      padding: 1rem;
      font-size: 1rem;
      line-height: 1.25;
      white-space: normal;
    }
  }
</style>
